services:
  owntone:
    image: rohmilkaese/owntone
    container_name: owntone
    ports:
      - "3689:3689"
      - "3688:3688"
      - "6601:6601"
    network_mode: host
    volumes:
      - ./owntone:/config
      - /etc/localtime:/etc/localtime:ro
      - ./owntone/data:/music
    restart: unless-stopped
